name: Amazon Bolton Job Monitor

on:
  workflow_dispatch:

jobs:
  check-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Check Amazon Bolton jobs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAMBOTTOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAMCHATID }}
        run: |
          cat > check.js <<'EOF'
          const { chromium } = require('playwright');
          const https = require('https');

          (async () => {
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage();

            const url = 'https://www.jobsatamazon.co.uk/app#/jobSearch?query=Warehouse%20Associate&locale=en-GB';

            console.log('Opening Amazon Jobs...');
            await page.goto(url, {
              waitUntil: 'domcontentloaded',
              timeout: 60000
            });

            await page.waitForTimeout(15000);

            console.log('Reading Amazon job page...');

            const text = await page.locator('body').innerText();

            console.log('----- AMAZON PAGE TEXT -----');
            console.log(text.substring(0, 15000));
            console.log('----- END PAGE TEXT -----');

            const lower = text.toLowerCase();

            const bolton =
              lower.includes('bolton') ||
              lower.includes('bl3') ||
              lower.includes('bl5');

            const warehouse =
              lower.includes('warehouse') ||
              lower.includes('fulfillment') ||
              lower.includes('fulfilment') ||
              lower.includes('sortation');

            console.log('Bolton/location detected:', bolton);
            console.log('Warehouse job detected:', warehouse);

            if (bolton && warehouse) {

              const message =
                '🔔 AMAZON BOLTON JOB ALERT!\\n\\n' +
                'A possible Bolton Amazon warehouse vacancy has been detected.\\n\\n' +
                'Check and apply yourself here:\\n' +
                url;

              const data = new URLSearchParams({
                chat_id: process.env.TELEGRAM_CHAT_ID,
                text: message
              }).toString();

              const req = https.request({
                hostname: 'api.telegram.org',
                path: `/bot${process.env.TELEGRAM_BOT_TOKEN}/sendMessage`,
                method: 'POST',
                headers: {
                  'Content-Type': 'application/x-www-form-urlencoded',
                  'Content-Length': Buffer.byteLength(data)
                }
              });

              req.on('error', err => {
                console.log('Telegram error:', err.message);
              });

              req.write(data);
              req.end();

              console.log('TELEGRAM ALERT SENT');
            } else {
              console.log('NO BOLTON WAREHOUSE VACANCY DETECTED');
            }

            await browser.close();
          })();
          EOF

          node check.js
