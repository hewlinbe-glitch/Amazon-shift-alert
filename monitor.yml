name: Amazon Bolton Job Monitor

on:
  workflow_dispatch:

jobs:
  check-amazon:
    runs-on: ubuntu-latest

    steps:
      - name: Check Amazon Bolton jobs
        run: |
          echo "🔎 Checking Amazon jobs for Bolton..."
          curl -L -s "https://www.jobsatamazon.co.uk/app#/jobSearch?query=Warehouse%20Associate&locale=en-GB" \
            -o amazon.html

          echo "Checking page..."
          grep -i -o "Bolton" amazon.html | head || true

      - name: Send Telegram test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAMBOTTOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAMCHATID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔎 Amazon Bolton monitor has started checking for jobs."
