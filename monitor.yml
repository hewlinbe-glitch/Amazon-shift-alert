name: Amazon Bolton Diagnostic

on:
  workflow_dispatch:

jobs:
  check-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check Amazon alert feed
        run: |
          python - <<'PY'
          import urllib.request
          import re
          import html

          url = "https://t.me/s/amazonukjobsalert"

          print("Opening Amazon UK alert feed...")

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              page = response.read().decode("utf-8", errors="ignore")

          print("Feed downloaded successfully.")
          print("Feed size:", len(page), "characters")

          # Extract visible Telegram message text
          messages = re.findall(
              r'<div class="tgme_widget_message_text[^>]*>(.*?)</div>',
              page,
              re.S
          )

          print("Messages found:", len(messages))
          print("")
          print("===== RECENT AMAZON ALERTS =====")

          for i, message in enumerate(messages[-10:], 1):
              text = re.sub(r'<[^>]+>', ' ', message)
              text = html.unescape(text)
              text = re.sub(r'\s+', ' ', text).strip()

              print("")
              print(f"--- ALERT {i} ---")
              print(text[:1500])

          print("")
          print("===== END =====")
          PY
